name: Check skills

on:
  pull_request:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Validate skills and installer discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate catalog and manifests
        run: ./scripts/check-skills.sh

      - name: List skills
        run: ./scripts/list-skills.sh

      - name: Smoke test skills CLI discovery
        shell: bash
        env:
          # Pinned deliberately: unpinned @latest turned an upstream CLI change
          # into a red build with no repository change behind it.  Bump on purpose.
          SKILLS_CLI_VERSION: "1.7.6"
        run: |
          set -uo pipefail
          output="$(mktemp)"
          # --yes: npm without a TTY otherwise aborts at the install prompt, which
          # surfaces here as an unexplained exit-1 step instead of a real check.
          npx --yes "skills@${SKILLS_CLI_VERSION}" add ./ --list >"$output" 2>&1
          status=$?
          cat "$output"
          if [ "$status" -ne 0 ]; then
            echo "skills CLI failed with exit $status; listing above." >&2
            exit "$status"
          fi
          python3 scripts/check_discovery.py <"$output"
